version: 2

updates:
  - package-ecosystem: npm
    directory: /renderer
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    # Historical PRs are settled. Version-only SemVer filtering leaves security updates enabled.
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#update-types--allow--
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "deps(renderer)"
    groups:
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      renderer-compatible:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "vitest", "@vitest/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "deps(gradle)"
    groups:
      android-test:
        applies-to: version-updates
        patterns: ["androidx.test*", "androidx.test.espresso*"]
        update-types: ["minor", "patch"]
      gradle-compatible:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["androidx.test*", "androidx.test.espresso*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
