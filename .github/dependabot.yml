version: 2

updates:
  - package-ecosystem: npm
    directory: /renderer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Pause ordinary updates until the historical queue has a final disposition.
    # Security updates remain enabled independently of this limit.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(renderer)"
    groups:
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      renderer-compatible:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "vitest", "@vitest/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(gradle)"
    groups:
      android-test:
        patterns: ["androidx.test*", "androidx.test.espresso*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
