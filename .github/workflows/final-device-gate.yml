name: Final Device Gate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit used by the signed production candidate
        required: true
        type: string
      candidate_run_id:
        description: Production Release Candidate workflow run ID
        required: true
        type: string
      candidate_artifact_name:
        description: Exact production-candidate-x.y.z-xxxxxxxxxxxx artifact name
        required: true
        type: string
      evidence_run_id:
        description: Authorized device-run workflow ID that uploaded the evidence artifact
        required: true
        type: string
      evidence_artifact_name:
        description: Exact artifact containing device-gate-evidence.json, test APK, and logs
        required: true
        type: string

permissions: {}

concurrency:
  group: final-device-gate-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  final-device-gate:
    runs-on: windows-2022
    timeout-minutes: 20
    environment: final-device-gate
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Validate immutable gate inputs
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_commit must be a full lowercase SHA.' }
          foreach ($value in @($env:CANDIDATE_RUN_ID, $env:EVIDENCE_RUN_ID)) {
            if ($value -notmatch '^[1-9][0-9]*$') { throw 'Workflow run IDs must be positive decimal integers.' }
          }
          if ($env:CANDIDATE_ARTIFACT_NAME -notmatch '^production-candidate-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}$') {
            throw 'candidate_artifact_name does not match the production candidate contract.'
          }
          if ($env:EVIDENCE_ARTIFACT_NAME -notmatch '^final-device-evidence-[A-Za-z0-9._-]+$') {
            throw 'evidence_artifact_name does not match the controlled evidence contract.'
          }
          if ($env:WORKFLOW_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:TRIGGER_SHA -cne $env:WORKFLOW_SHA -or
              $env:WORKFLOW_REF -ne 'refs/heads/main' -or $env:WORKFLOW_EVENT -ne 'workflow_dispatch') {
            throw 'Final Device Gate must use the trusted workflow dispatched on refs/heads/main.'
          }

      - name: Check out the trusted candidate validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Bind candidate and evidence runs to allowed workflow identities
        id: run-policy
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          VALIDATOR_COMMIT: ${{ github.workflow_sha }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          function Get-Run([string] $RunId) {
            return Invoke-RestMethod -Headers $headers -Uri "$env:API_URL/repos/$env:REPOSITORY/actions/runs/$RunId"
          }
          Import-Module .\scripts\DeviceGateEvidence.psm1 -Force
          Import-Module .\scripts\ProductionReleasePolicy.psm1 -Force
          $candidateRun = Get-Run $env:CANDIDATE_RUN_ID
          $evidenceRun = Get-Run $env:EVIDENCE_RUN_ID
          $null = Assert-DeviceGateWorkflowRun -Run $candidateRun -ExpectedRepository $env:REPOSITORY -ExpectedSourceCommit $env:SOURCE_COMMIT -ExpectedPath '.github/workflows/release.yml' -ExpectedEvent 'workflow_dispatch'
          Assert-CommitAncestor -AncestorCommit $env:SOURCE_COMMIT -DescendantCommit $evidenceRun.head_sha -Repository $env:REPOSITORY -GitHubToken $env:GH_TOKEN -ApiBaseUrl $env:API_URL
          Assert-CommitAncestor -AncestorCommit $evidenceRun.head_sha -DescendantCommit $env:VALIDATOR_COMMIT -Repository $env:REPOSITORY -GitHubToken $env:GH_TOKEN -ApiBaseUrl $env:API_URL
          $null = Assert-DeviceGateWorkflowRun -Run $evidenceRun -ExpectedRepository $env:REPOSITORY -ExpectedSourceCommit $evidenceRun.head_sha -ExpectedPath '.github/workflows/capture-device-gate-evidence.yml' -ExpectedEvent 'workflow_dispatch'
          "evidence_workflow_sha=$($evidenceRun.head_sha)" >> $env:GITHUB_OUTPUT
          "candidate_run_attempt=$([int]$candidateRun.run_attempt)" >> $env:GITHUB_OUTPUT
          "evidence_run_attempt=$([int]$evidenceRun.run_attempt)" >> $env:GITHUB_OUTPUT
          'evidence_workflow_path=.github/workflows/capture-device-gate-evidence.yml' >> $env:GITHUB_OUTPUT
          'evidence_workflow_event=workflow_dispatch' >> $env:GITHUB_OUTPUT

      - name: Set up JDK 17 for APK certificate inspection
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android artifact inspection tools
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -File | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools" }
          & $sdkManager.FullName 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the attested signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: final-gate-input/candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download controlled device evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: final-gate-input/evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate provenance and final device evidence
        id: verify
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.run-policy.outputs.candidate_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_RUN_ATTEMPT: ${{ steps.run-policy.outputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW_PATH: ${{ steps.run-policy.outputs.evidence_workflow_path }}
          EVIDENCE_WORKFLOW_EVENT: ${{ steps.run-policy.outputs.evidence_workflow_event }}
          EVIDENCE_WORKFLOW_SHA: ${{ steps.run-policy.outputs.evidence_workflow_sha }}
          VALIDATOR_COMMIT: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $candidateRoot = [IO.Path]::GetFullPath('final-gate-input/candidate')
          $evidenceRoot = [IO.Path]::GetFullPath('final-gate-input/evidence')
          $metadataPath = Join-Path $candidateRoot 'release-metadata.json'
          $evidencePath = Join-Path $evidenceRoot 'device-gate-evidence.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) { throw 'Candidate release-metadata.json is missing.' }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) { throw 'Controlled device-gate-evidence.json is missing.' }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ([long]$metadata.source.runId -ne [long]$env:CANDIDATE_RUN_ID -or
              [int]$metadata.source.runAttempt -ne [int]$env:CANDIDATE_RUN_ATTEMPT) {
            throw 'Candidate artifact came from a different workflow run/attempt.'
          }
          if ([long]$evidence.candidate.candidateRunId -ne [long]$env:CANDIDATE_RUN_ID -or
              [int]$evidence.candidate.candidateRunAttempt -ne [int]$env:CANDIDATE_RUN_ATTEMPT -or
              $evidence.candidate.candidateArtifactName -cne $env:CANDIDATE_ARTIFACT_NAME) {
            throw 'Device evidence names a different signed candidate artifact.'
          }
          if ($metadata.versionName -cnotmatch '^\d+\.\d+\.\d+$' -or
              $evidence.candidate.productionApk.name -cne "lyrics-card-generator-android-$($metadata.versionName).apk" -or
              $evidence.candidate.productionAab.name -cne "lyrics-card-generator-android-$($metadata.versionName).aab" -or
              $evidence.candidate.testApk.name -cne 'app-production-release-androidTest.apk') {
            throw 'Evidence artifact names do not match the exact production and separate test APK contract.'
          }

          $apkPath = Join-Path $candidateRoot $evidence.candidate.productionApk.name
          $aabPath = Join-Path $candidateRoot $evidence.candidate.productionAab.name
          $testApkPath = Join-Path $evidenceRoot $evidence.candidate.testApk.name
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $aapt2 = Join-Path $sdkRoot 'build-tools\36.1.0\aapt2.exe'
          $apkSigner = Join-Path $sdkRoot 'build-tools\36.1.0\apksigner.bat'
          $testApk = Get-Item -LiteralPath $testApkPath -ErrorAction Stop
          foreach ($asset in @(Get-ChildItem -LiteralPath $candidateRoot -File) + @($testApk)) {
            gh attestation verify $asset.FullName `
              --repo $env:REPOSITORY `
              --signer-workflow "$env:REPOSITORY/.github/workflows/release.yml" `
              --source-ref refs/heads/main `
              --source-digest $env:SOURCE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Candidate/test attestation failed: $($asset.Name)" }
          }

          .\scripts\validate-device-gate-evidence.ps1 `
            -EvidencePath $evidencePath `
            -ReleaseMetadataPath $metadataPath `
            -ProductionApkPath $apkPath `
            -ProductionAabPath $aabPath `
            -TestApkPath $testApkPath `
            -ExpectedRepository $env:REPOSITORY `
            -ExpectedSourceCommit $env:SOURCE_COMMIT `
            -ExpectedEvidenceRunId ([long]$env:EVIDENCE_RUN_ID) `
            -ExpectedEvidenceRunAttempt ([int]$env:EVIDENCE_RUN_ATTEMPT) `
            -ExpectedEvidenceWorkflowPath $env:EVIDENCE_WORKFLOW_PATH `
            -ExpectedEvidenceWorkflowEvent $env:EVIDENCE_WORKFLOW_EVENT `
            -ExpectedEvidenceArtifactName $env:EVIDENCE_ARTIFACT_NAME `
            -Aapt2Path $aapt2 `
            -ApkSignerPath $apkSigner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $evidenceSha = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path 'final-gate-result' | Out-Null
          [ordered]@{
            schemaVersion = 1
            status = 'FINAL READY'
            sourceCommit = $env:SOURCE_COMMIT
            candidateRunId = [long]$env:CANDIDATE_RUN_ID
            candidateArtifactName = $env:CANDIDATE_ARTIFACT_NAME
            evidenceRunId = [long]$env:EVIDENCE_RUN_ID
            evidenceWorkflowSha = $env:EVIDENCE_WORKFLOW_SHA
            validatorCommit = $env:VALIDATOR_COMMIT
            evidenceArtifactName = $env:EVIDENCE_ARTIFACT_NAME
            evidenceSha256 = $evidenceSha
          } | ConvertTo-Json | Set-Content -LiteralPath 'final-gate-result/final-device-gate-verdict.json' -Encoding utf8

      - name: Upload final device-gate verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-device-gate-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 90
          path: final-gate-result/final-device-gate-verdict.json
