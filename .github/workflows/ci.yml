name: Android Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Install pinned Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -File | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools" }
          & $sdkManager.FullName 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install renderer dependencies
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit renderer dependencies with bounded service retries
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd run audit:security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify renderer types and tests
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CI scope and audit failure handling
        shell: pwsh
        run: |
          node --test scripts/test-ci-tools.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify dependency-security contract
        shell: pwsh
        run: |
          .\scripts\test-dependency-security-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production release policy contract
        shell: pwsh
        run: |
          .\scripts\test-production-release-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test-frozen-source-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify final device-gate evidence contract
        shell: pwsh
        run: |
          .\scripts\test-device-gate-evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Android JVM, lint, debug, R8, APK, and AAB gates
        shell: pwsh
        run: |
          .\gradlew.bat :app:test :app:lintProductionRelease :app:assembleAlphaDebug :app:assembleProductionDebug :app:assembleProductionRelease :app:bundleProductionRelease --no-parallel --stacktrace --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated renderer does not dirty the source tree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($changes.Count -ne 0) {
            $changes | Write-Output
            throw 'A normal quality-gate build changed the source tree.'
          }

      - name: Upload non-release quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-gate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/alpha/debug/*.apk
            app/build/outputs/apk/production/debug/*.apk
            app/build/outputs/apk/production/release/*.apk
            app/build/outputs/bundle/productionRelease/*.aab
            app/build/reports/lint-results-productionRelease.*

  unicode-path-jvm-smoke:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out candidate under a Unicode path
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: 歌词卡片
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Unicode smoke scope
        id: scope
        working-directory: 歌词卡片
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci-scope.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up JDK 17
        if: steps.scope.outputs.unicode == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        if: steps.scope.outputs.unicode == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up Gradle
        if: steps.scope.outputs.unicode == 'true'
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Install pinned Android SDK packages
        if: steps.scope.outputs.unicode == 'true'
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -File | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools" }
          & $sdkManager.FullName 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run a real JVM test through the Unicode-path wrapper
        if: steps.scope.outputs.unicode == 'true'
        working-directory: 歌词卡片
        shell: pwsh
        run: |
          .\scripts\gradle-via-ascii-worktree.ps1 `
            -StagingRoot (Join-Path $env:RUNNER_TEMP 'lyrics-card-gradle-staging') `
            -GradleArguments @(
              ':app:testAlphaDebugUnitTest',
              '--rerun',
              '--tests',
              'com.qrzzzz.lyricscard.model.LyricTextCleanerTest',
              '--no-parallel',
              '--no-daemon',
              '--stacktrace',
              '--console=plain'
            )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
