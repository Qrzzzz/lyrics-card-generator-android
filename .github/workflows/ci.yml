name: Android Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      renderer: ${{ steps.scope.outputs.renderer }}
      android: ${{ steps.scope.outputs.android }}
      contracts: ${{ steps.scope.outputs.contracts }}
      audit: ${{ steps.scope.outputs.audit }}
      full: ${{ steps.scope.outputs.full }}
      unicode: ${{ steps.scope.outputs.unicode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Determine required checks from exact PR changes
        id: scope
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci-scope.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  renderer:
    needs: scope
    if: needs.scope.outputs.renderer == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install renderer dependencies
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify renderer types, tests, and build
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd run check 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'renderer-check.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve renderer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/renderer-check.log

  audit:
    needs: scope
    if: needs.scope.outputs.audit == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install renderer dependencies
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit renderer dependencies with bounded service retries
        working-directory: renderer
        shell: pwsh
        env:
          AUDIT_DIAGNOSTIC_PATH: ${{ runner.temp }}/npm-audit.log
        run: |
          npm.cmd run audit:security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve audit result or unavailable-service diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/npm-audit.log

  contracts:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install contract parser
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify workflow and evidence contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path (Join-Path $env:RUNNER_TEMP 'contracts.log')
          try {
            node --test scripts/test-ci-tools.mjs scripts/test-publish-release.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File scripts/test-dependency-security-contract.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File scripts/test-production-release-contract.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File scripts/test-frozen-source-contract.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pwsh -NoProfile -File scripts/test-device-gate-evidence.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Transcript }
      - name: Preserve contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/contracts.log

  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install pinned Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -File | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools" }
          & $sdkManager.FullName 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install renderer dependencies for Android assets
        working-directory: renderer
        shell: pwsh
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run applicable Android gates
        shell: pwsh
        env:
          FULL_ANDROID_GATE: ${{ needs.scope.outputs.full }}
        run: |
          $tasks = if ($env:FULL_ANDROID_GATE -eq 'true') {
            @(':app:verifyBouncyCastleResolution', ':app:verifyNettyResolution', ':app:verifyHostParserResolution', ':app:verifyProtobufAndAccessibilityResolution', ':app:test', ':app:lintProductionRelease', ':app:assembleAlphaDebug', ':app:assembleProductionDebug', ':app:assembleProductionRelease', ':app:bundleProductionRelease', ':app:dumpProductionReleaseBundleManifest', ':app:assembleProductionReleaseAndroidTest')
          } elseif ($env:FULL_ANDROID_GATE -eq 'false') {
            @(':app:testProductionDebugUnitTest', ':app:lintProductionDebug', ':app:assembleProductionDebug')
          } else { throw 'Missing or invalid Android scope.' }
          .\gradlew.bat @tasks --no-parallel --stacktrace --console=plain 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'android-gate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated renderer does not dirty the source tree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=all)
          if ($changes.Count -ne 0) {
            $changes | Write-Output
            throw 'A normal quality-gate build changed the source tree.'
          }
      - name: Preserve Android reports even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/android-gate.log
            app/build/reports/
            app/build/test-results/
      - name: Upload full non-release build evidence outside PRs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/alpha/debug/*.apk
            app/build/outputs/apk/production/debug/*.apk
            app/build/outputs/apk/production/release/*.apk
            app/build/outputs/bundle/productionRelease/*.aab

  quality-gate:
    needs: [scope, renderer, android, contracts, audit, unicode-path-jvm-smoke]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Reject missing, skipped, cancelled, or failed required work
        shell: pwsh
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node scripts/ci-scope.mjs --summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  unicode-path-jvm-smoke:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out candidate under a Unicode path
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: 歌词卡片
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Unicode smoke scope
        id: scope
        working-directory: 歌词卡片
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci-scope.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up JDK 17
        if: steps.scope.outputs.unicode == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        if: steps.scope.outputs.unicode == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up Gradle
        if: steps.scope.outputs.unicode == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install pinned Android SDK packages
        if: steps.scope.outputs.unicode == 'true'
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          $sdkManager = Get-ChildItem -Path (Join-Path $sdkRoot 'cmdline-tools') -Filter 'sdkmanager.bat' -Recurse -File | Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot\cmdline-tools" }
          & $sdkManager.FullName 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run a real JVM test through the Unicode-path wrapper
        if: steps.scope.outputs.unicode == 'true'
        working-directory: 歌词卡片
        shell: pwsh
        run: |
          .\scripts\gradle-via-ascii-worktree.ps1 `
            -StagingRoot (Join-Path $env:RUNNER_TEMP 'lyrics-card-gradle-staging') `
            -GradleArguments @(
              ':app:testAlphaDebugUnitTest',
              '--rerun',
              '--tests',
              'com.qrzzzz.lyricscard.model.LyricTextCleanerTest',
              '--no-parallel',
              '--no-daemon',
              '--stacktrace',
              '--console=plain'
            )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
