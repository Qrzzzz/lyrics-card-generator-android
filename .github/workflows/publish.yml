name: Publish Verified Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a committed manual acceptance record (x.y.z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: final-device-gate
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the approved publication policy and acceptance record
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate the committed manual acceptance
        id: acceptance
        run: node scripts/publish-release.mjs prepare
      - name: Download the original signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.acceptance.outputs.artifact_name }}
          run-id: ${{ steps.acceptance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-input
      - name: Verify provenance and publish the original five assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs publish
      - name: Preserve the publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ inputs.version }}
          path: publication-result.json
          if-no-files-found: error
          retention-days: 90
