name: Capture Device Gate Evidence
# Optional full-matrix diagnostics. Disabled in Actions by default; not a release prerequisite.

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main commit used by the production candidate
        required: true
        type: string
      candidate_run_id:
        description: Production Release Candidate workflow run ID
        required: true
        type: string
      candidate_artifact_name:
        description: Exact production candidate artifact name
        required: true
        type: string
      physical_device_serial:
        description: Authorized adb serial attached to the controlled runner
        required: true
        type: string
      authorization_reference:
        description: Human authorization reference for the physical device run
        required: true
        type: string

permissions: {}

concurrency:
  group: capture-device-gate-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  capture-device-evidence:
    runs-on: [self-hosted, Windows, X64, lcg-device-gate]
    timeout-minutes: 150
    environment: final-device-gate
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Validate immutable capture inputs
        id: input-policy
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          $dispatch = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $physicalSerial = [string]$dispatch.inputs.physical_device_serial
          if ($physicalSerial -cnotmatch '^[A-Za-z0-9._:-]{1,128}$') { throw 'physical_device_serial has an unsupported format.' }
          Write-Host "::add-mask::$physicalSerial"
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_commit must be a full lowercase SHA.' }
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'candidate_run_id must be a positive integer.' }
          if ($env:CANDIDATE_ARTIFACT_NAME -notmatch '^production-candidate-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}$') { throw 'candidate_artifact_name is invalid.' }
          if ($env:WORKFLOW_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:TRIGGER_SHA -cne $env:WORKFLOW_SHA -or $env:WORKFLOW_REF -ne 'refs/heads/main' -or
              $env:WORKFLOW_EVENT -ne 'workflow_dispatch') {
            throw 'Device capture must use the trusted workflow dispatched on refs/heads/main.'
          }
          $testArtifactName = $env:CANDIDATE_ARTIFACT_NAME.Replace('production-candidate-', 'production-device-test-')
          "test_artifact_name=$testArtifactName" >> $env:GITHUB_OUTPUT

      - name: Check out trusted workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify frozen source belongs to trusted main history
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VALIDATOR_COMMIT: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/ProductionReleasePolicy.psm1 -Force
          Assert-CommitAncestor -AncestorCommit $env:SOURCE_COMMIT -DescendantCommit $env:VALIDATOR_COMMIT -Repository $env:GITHUB_REPOSITORY -GitHubToken $env:GH_TOKEN

      - name: Download attested signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: device-gate-input/candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download the same candidate run's signed test APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.input-policy.outputs.test_artifact_name }}
          path: device-gate-input/test
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate and test provenance before touching devices
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/DeviceGateEvidence.psm1 -Force
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate workflow run could not be inspected.' }
          $null = Assert-DeviceGateWorkflowRun -Run $run -ExpectedRepository $env:GITHUB_REPOSITORY -ExpectedSourceCommit $env:SOURCE_COMMIT -ExpectedPath '.github/workflows/release.yml' -ExpectedEvent 'workflow_dispatch'
          $assets = @(Get-ChildItem device-gate-input/candidate -File)
          $testApk = Get-Item 'device-gate-input/test/app-production-release-androidTest.apk'
          if (@(Get-ChildItem device-gate-input/test -File).Count -ne 1) { throw 'Exactly one signed device test APK is required.' }
          foreach ($asset in @($assets) + @($testApk)) {
            gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest $env:SOURCE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Candidate/test attestation failed: $($asset.Name)" }
          }

      - name: Capture authorized emulator and physical-device matrix
        id: capture
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          PHYSICAL_DEVICE_SERIAL: ${{ inputs.physical_device_serial }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $artifactName = "final-device-evidence-$($env:SOURCE_COMMIT.Substring(0, 12))"
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          .\scripts\capture-device-gate-evidence.ps1 `
            -CandidateRoot 'device-gate-input/candidate' `
            -TestApkPath 'device-gate-input/test/app-production-release-androidTest.apk' `
            -OutputRoot 'device-gate-output' `
            -SourceCommit $env:SOURCE_COMMIT `
            -CandidateRunId ([long]$env:CANDIDATE_RUN_ID) `
            -CandidateArtifactName $env:CANDIDATE_ARTIFACT_NAME `
            -EvidenceRunId ([long]$env:EVIDENCE_RUN_ID) `
            -EvidenceRunAttempt ([int]$env:EVIDENCE_RUN_ATTEMPT) `
            -EvidenceArtifactName $artifactName `
            -PhysicalDeviceSerial $env:PHYSICAL_DEVICE_SERIAL `
            -AuthorizationReference $env:AUTHORIZATION_REFERENCE `
            -AndroidSdkRoot $env:ANDROID_HOME `
            -AvdRoot (Join-Path $env:RUNNER_TEMP "lcg-avd-$env:EVIDENCE_RUN_ID")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate captured evidence before upload
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $metadata = Get-Content -LiteralPath 'device-gate-input/candidate/release-metadata.json' -Raw | ConvertFrom-Json
          $artifactName = "final-device-evidence-$($env:SOURCE_COMMIT.Substring(0, 12))"
          .\scripts\validate-device-gate-evidence.ps1 `
            -EvidencePath 'device-gate-output/device-gate-evidence.json' `
            -ReleaseMetadataPath 'device-gate-input/candidate/release-metadata.json' `
            -ProductionApkPath "device-gate-input/candidate/lyrics-card-generator-android-$($metadata.versionName).apk" `
            -ProductionAabPath "device-gate-input/candidate/lyrics-card-generator-android-$($metadata.versionName).aab" `
            -TestApkPath 'device-gate-output/app-production-release-androidTest.apk' `
            -ExpectedRepository $env:GITHUB_REPOSITORY `
            -ExpectedSourceCommit $env:SOURCE_COMMIT `
            -ExpectedEvidenceRunId ([long]$env:EVIDENCE_RUN_ID) `
            -ExpectedEvidenceRunAttempt ([int]$env:EVIDENCE_RUN_ATTEMPT) `
            -ExpectedEvidenceWorkflowPath '.github/workflows/capture-device-gate-evidence.yml' `
            -ExpectedEvidenceWorkflowEvent 'workflow_dispatch' `
            -ExpectedEvidenceArtifactName $artifactName `
            -Aapt2Path (Join-Path $env:ANDROID_HOME 'build-tools\36.1.0\aapt2.exe') `
            -ApkSignerPath (Join-Path $env:ANDROID_HOME 'build-tools\36.1.0\apksigner.bat')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload controlled device evidence
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          if-no-files-found: warn
          retention-days: 90
          path: device-gate-output/**
